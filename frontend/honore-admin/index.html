<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Tuyishime Honore</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="icon" type="image/jpeg" href="../assets/images/WhatsApp%20Image%202026-05-29%20at%204.32.30%20PM.jpeg" />
</head>
<body class="admin-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="../assets/images/WhatsApp%20Image%202026-05-29%20at%204.32.30%20PM.jpeg" alt="Tuyishime Honore Logo" class="login-logo">
        <h2>Admin Portal</h2>
        <p>Sign in to manage your portfolio</p>
      </div>

      <div id="error-alert" class="error-message">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="error-text">Invalid email or password.</span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-control" placeholder="tuyishimehonore63@gmail.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            <i class="fa-solid fa-eye-slash password-toggle" id="toggle-password" title="Show/Hide Password"></i>
          </div>
        </div>

        <div class="form-actions">
          <label class="remember-me">
            <input type="checkbox" id="remember-me">
            <span>Remember Me</span>
          </label>
        </div>

        <button type="submit" id="submit-btn" class="admin-btn">
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
